version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mosprom-backend:latest
    container_name: mosprom-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-appuser}:${POSTGRES_PASSWORD:-apppassword}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-appdb}
      HOST: 0.0.0.0
      PORT: 7878
      RELOAD: "False"
    ports:
      - "7878:7878"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "until pg_isready -h $POSTGRES_HOST -p ${POSTGRES_PORT:-5432} -U $POSTGRES_USER; do echo waiting for db; sleep 2; done; exec python run.py"
    volumes:
      - ./logs:/app/logs
      - ./static:/app/static
    networks:
      - hackk_network

  postgres:
    image: postgres:15-alpine
    container_name: hackk_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppassword}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-appdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - hackk_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hackk_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - hackk_network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  hackk_network:
    driver: bridge
